model:
    cls: LoopedDiT_B_4
    # Segmented looping architecture parameters
    n_prefix: 5   # Number of prefix blocks (independent)
    n_shared: 2   # Number of shared blocks for looping  
    n_loops: 4    # Number of times to loop the shared blocks
    n_suffix: 5   # Number of suffix blocks (independent)
    use_loop_emb: True
    dropout_prob: 0.0

evaluation:
    loop_list: [1, 2, 4, 6, 8, 12]

wandb:
    enable: False

load_from: ""

eval_only: True