model:
    cls: LoopedDiT_B_4
    # Segmented looping architecture parameters
    n_prefix: 0   # Number of prefix blocks (independent)
    n_shared: 2   # Number of shared blocks for looping  
    n_loops: 6    # Number of times to loop the shared blocks
    n_suffix: 0   # Number of suffix blocks (independent)
    use_loop_emb: True
    use_input_injection: False
    use_noise_init: False

training:
    batch_size: 64
    num_epochs: 240
    sample_on_training: False
    fid_per_epoch: 1

# Load checkpoints for eval or resuming training.
# load_from: CKPT_PATH

load_from: null
eval_only: False