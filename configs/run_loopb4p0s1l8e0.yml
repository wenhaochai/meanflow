model:
    cls: LoopedDiT_B_4
    # Segmented looping architecture parameters
    n_prefix: 0   # Number of prefix blocks (independent)
    n_shared: 1   # Number of shared blocks for looping  
    n_loops: 8    # Number of times to loop the shared blocks
    n_suffix: 0   # Number of suffix blocks (independent)
    # Total effective depth: n_prefix + (n_shared * n_loops) + n_suffix = 0 + 8 + 0 = 8 layers

training:
    sample_on_training: False
    sample_per_epoch: 10
    fid_per_epoch: 1

# Load checkpoints for eval or resuming training.
# load_from: CKPT_PATH

load_from: null
eval_only: False