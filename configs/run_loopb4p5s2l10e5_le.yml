model:
    cls: LoopedDiT_B_4
    # Segmented looping architecture parameters
    n_prefix: 5   # Number of prefix blocks (independent)
    n_shared: 2   # Number of shared blocks for looping  
    n_loops: 10    # Number of times to loop the shared blocks
    n_suffix: 5   # Number of suffix blocks (independent)
    use_loop_emb: True
    use_input_injection: False
    use_noise_init: False

training:
    sample_on_training: False
    fid_per_epoch: 10

# Load checkpoints for eval or resuming training.
# load_from: CKPT_PATH

load_from: null
eval_only: False